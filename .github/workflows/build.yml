name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version || true
          ls /Applications | grep -i '^Xcode' || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project (pin objectVersion for compatibility)
        run: |
          xcodegen generate
          PBX=FCEmulator.xcodeproj/project.pbxproj
          sed -i '' 's/objectVersion = 77;/objectVersion = 60;/' "$PBX" || true
          sed -i '' 's/objectVersion = 70;/objectVersion = 60;/' "$PBX" || true
          grep -m1 objectVersion "$PBX"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project FCEmulator.xcodeproj \
            -scheme FCEmulator \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -100

      - name: Verify bundle
        run: |
          APP="build/Build/Products/Release-iphoneos/FCEmulator.app"
          ls -la "$APP" || ls -la build/Build/Products/Release-iphoneos/ || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
          echo "--- 检查 ROM 与模拟器资源 ---"
          ls -la "$APP/roms" 2>/dev/null || ls -la "$APP" | grep -iE "rom|emulator|nes" || true
          du -sh "$APP"

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/FCEmulator.app"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr "红白机_V1.ipa" Payload
          ls -la "红白机_V1.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: fc-ipa
          path: 红白机_V1.ipa
          if-no-files-found: error
